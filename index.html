    <style>
        :root {
            --bg-body: #f0f4f9;
            --bg-panel: #ffffff;
            --bg-column: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #334155;
            --border-color: #dce3ec;
            --input-bg: #fafcfd;
            --input-border: #cbd5e1;
            --input-focus: #3b82f6;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.04);
            --btn-bg: #1e293b;
            --btn-hover: #0f172a;
            --btn-primary: #2563eb;
            --btn-primary-hover: #1d4ed8;
            --radius: 8px;
            --transition: 0.2s;
        }

        body.dark-theme {
            --bg-body: #12161e;
            --bg-panel: #1f2937;
            --bg-column: #1f2937;
            --text-primary: #e7edf4;
            --text-secondary: #b9c7da;
            --border-color: #334155;
            --input-bg: #2d3a4b;
            --input-border: #4a5a70;
            --input-focus: #60a5fa;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            --btn-bg: #3b4a5e;
            --btn-hover: #4e5f77;
            --btn-primary: #3b82f6;
            --btn-primary-hover: #60a5fa;
        }

        body {
            /*font-family: 'Inter', system-ui, -apple-system, sans-serif;*/
            background: var(--bg-body);
            color: var(--text-primary);
            padding: 4px 4px;
            margin: 0 auto;
            transition: background var(--transition), color var(--transition);
        }

        .data {
            background: var(--bg-panel);
            border-radius: var(--radius);
            padding: 4px 4px;
            margin-bottom: 2px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 4px;
            transition: background var(--transition), border var(--transition);
        }

        .form-group {
            flex:1;
            display: flex;
            align-items: center;
            gap: 2px 4px;
            flex-wrap: nowrap;
        }

        .form-group label {
            min-width: 16px;
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 0.02em;
            color: var(--text-secondary);
            text-align: end;
            line-height: 1;
        }

        .form-group input {
            flex:1;
            padding: 4px 4px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            width: 32px;
            height: 16px;
            font-size: 11px;
            font-weight: 500;
            background: var(--input-bg);
            color: var(--text-primary);
            outline: none;
            transition: border var(--transition), box-shadow var(--transition), background var(--transition), color var(--transition);
        }

        .form-group input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .form-group input[type="number"] {
            appearance: textfield;
        }
        .form-group input::-webkit-outer-spin-button,
        .form-group input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        button {
            background: var(--btn-bg);
            color: white;
            border: none;
            padding: 2px 10px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 24px;
            line-height: 1;
            white-space: nowrap;
        }

        button:hover {
            background: var(--btn-hover);
            transform: scale(0.96);
        }

        button:active {
            transform: scale(0.93);
        }

        .row {
            display: flex;
            flex-direction: row;
            gap: 2px;
            margin-top: 2px;
        }

        .column {
            flex: 1 1 auto;
            min-width: 180px;
            display: flex;
            flex-direction: column;
            background: var(--bg-column);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: background var(--transition), border var(--transition);
        }

        .colhead {
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.03em;
            color: var(--text-secondary);
            padding: 2px 0 6px;
            border-bottom: 1px dashed var(--border-color);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        pre {
            padding: 1px 0px 0px 0px;
            border-top: 1px dashed var(--border-color);
            margin: 0%;
        }
        code.hljs {
            white-space: pre;
            font-family: monospace;
            overflow-x: auto;
            border-bottom-right-radius: 4px;
            border-bottom-left-radius: 4px;
        }

        code::-webkit-scrollbar { width: 8px; height: 8px; }
        code::-webkit-scrollbar-track { background: #00000000; }
        code::-webkit-scrollbar-thumb { background: #808080; border-radius: 4px; }
        code::-webkit-scrollbar-thumb:hover { background: #3d3d3d; }


        @media print {
            .no-print {
                display: none !important;
            }
            .diagram-labels-scrollable::-webkit-scrollbar { width: 4px !important; height: 4px !important; }
            .diagram-labels-scrollable::-webkit-scrollbar-thumb { background: #808080; border-radius: 2px !important; }
        }

        @media screen and (max-width: 824px) {
            body {
                padding: 2px 2px;
            }

            .data {
                flex-wrap: wrap;
                gap: 4px;
            }

            .form-group {
                flex: 0 0 calc(50% - 4px);
                min-width: 0;
            }

            .form-group label {
                min-width: 20px;
                font-size: 10px;
            }

            .form-group input {
                font-size: 10px;
                height: 20px;
                padding: 2px 4px;
                min-width: 20px;
            }

            .row {
                flex-direction: column;
                gap: 6px;
            }

            .column {
                min-width: 0;
                width: 100%;
            }

            .colhead {
                font-size: 11px;
                padding: 4px 0 6px;
            }

            button {
                padding: 0px;
            }
            

            code.hljs {
                max-height: 200px;
            }

            /* Прячем или уменьшаем хедер */
            .data .form-group {
                flex: 0 0 calc(25% - 4px);
            }

            .data .form-group:nth-child(n+9), .data button {
                flex: 0 0 calc(16.66% - 4px);
            }
        }
    </style>
</head>

    <!-- Контейнер диаграмм -->
    <div class="row">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script id="code">
        var i=-1; customElements.define('doughnut-chart', Doughnut);
        function element(ns,type,attrs,inner){
            const n=({'svg':'http://www.w3.org/2000/svg','html':'http://www.w3.org/1999/xhtml','mathml':'http://www.w3.org/1998/Math/MathML'});
            const e=document.createElementNS(n[ns] || n['html'],type);
            if(attrs){Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));}
            if(inner){if(typeof inner === 'string'){e.innerHTML=inner;}else if(Array.isArray(inner)){inner.forEach((el)=>e.appendChild(el));}else{e.append(inner);}}
            return e;
        }

        function gencolor(){
            return [Math.floor(Math.random()*255),Math.floor(Math.random()*255),Math.floor(Math.random()*255),0.9];
        }

        function array2color(arr,alpha=true,prefix='#',padsl=2,padsc='0',delim='',suffix=''){ 
            return prefix+arr.map((e,i)=>Math.floor(i<3 ? e : e*255).toString(16).padStart(padsl,padsc)).filter((_,i)=>alpha || i<3).join(delim)+suffix;
        }

        function callback(e){
            console.log(e); alert(`g:${e.g} v:${e.v} l:${typeof e.l === 'string' ? e.l : e.l.textContent} c:${e.c}`);
        }

        function save(inline=false){
            function getInlineStyles(element, styles='', properties=['style', 'color', 'font', 'background', 'margin', 'padding', 'border', 'width', 'height', 'display', 'position', 'd' ,'fill']) {
                const def=['auto','none','normal'],computed = window.getComputedStyle(element);
                Array.from(computed).forEach((e)=>{
                    if(computed[e] && !def.includes(computed[e])){styles+=`${e}:${computed[e]}; `;}
                });
                return styles;
            }
            var html=document.documentElement;
            if(inline){
                html=html.cloneNode(true);
                const orig=Array.from(document.documentElement.querySelectorAll('*'));
                Array.from(html.querySelectorAll('*')).forEach((e,i)=>e.setAttribute('style',getInlineStyles(orig[i])));
                Array.from(html.querySelectorAll('style')).forEach((e)=>e.parentElement.removeChild(e));
            }
            
            if('showSaveFilePicker' in window){
                const blob = new Blob([html.outerHTML], { type: 'text/html;charset=utf-8' });
                const handle = window.showSaveFilePicker({
                    suggestedName: 'svg.html',
                    types: [{
                        description: 'HTML',
                        accept: { 'text/html': ['.html'] }
                    }]
                }).then((h)=>h.createWritable()).then((w)=>{w.write(blob); w.close();}).catch((e)=>console.log(e));
            }else{
                navigator.clipboard.writeText(html.outerHTML).then(() => alert('HTML copied to clipboard!')).catch(e => console.error('Error:', e));
            }
        }
        
        function rebuildContainer() {
            if(typeof Doughnut === 'function'){
                // get parameters start    
                i++; 
                const ro=parseFloat(document.getElementById('iro').value) || 0;
                const ri=parseFloat(document.getElementById('iri').value) || 0;
                const bos=parseFloat(document.getElementById('ibos').value) || 0;
                const boe=parseFloat(document.getElementById('iboe').value) || 0;
                const bis=parseFloat(document.getElementById('ibis').value) || 0;
                const bie=parseFloat(document.getElementById('ibie').value) || 0;
                const sa=(parseFloat(document.getElementById('isa').value) || 0)*Math.PI/180;
                const pa=(parseFloat(document.getElementById('ipa').value) || 0)*Math.PI/180;
                const duration=parseFloat(document.getElementById('idur').value) || 0;
                // get parameters end
                // code of doughnut1 start
                const doughnut1 = document.getElementById('chart1');
                //clear if js enabled in saved html
                if(i===0){doughnut1.innerHTML='';}
                doughnut1.duration=duration;

                const data1=Array.from({ length: Math.floor(Math.random() * 20) }, () => ({
                    v:Math.floor(Math.random() * 2000000), c:gencolor()
                })).map((e)=>({
                    v:e.v, l:element(null,'a',{"href":'https://get-color.ru/'+array2color(e.c,false)},array2color(e.c)), c:e.c, g:'data1',
                    p:{ ro:ro, ri:ro-(ro-ri)/2, os:bos, oe:boe, is:bis, ie:bie, sa:sa, pa:pa, cw:true }
                })).sort((a,b)=>b.v-a.v);

                const data2=Array.from({ length: Math.floor(Math.random() * 10) }, () => ({
                    v:Math.floor(Math.random() * 2000000), c:gencolor()
                })).map((e,i)=>({
                    v:e.v, l:element(null,'a',{"href":'https://get-color.ru/'+array2color(e.c,false)},array2color(e.c)), c:e.c, g:'data2',
                    p:{ ro:ri+(ro-ri)/2, ri:ri, os:bos, oe:boe, is:bis, ie:bie, sa:sa, pa:pa, cw:false }
                })).sort((a,b)=>b.v-a.v);

                doughnut1.formatnumbers=true;
                doughnut1.data=i%4==0 ? [data1] : [data1,data2];
                doughnut1.addListener(callback);
                // code of doughnut1 end
                // code of doughnut2 start
                const doughnut2 = document.getElementById('chart2');
                //clear if js enabled in saved html
                if(i===0){doughnut2.innerHTML='';}
                doughnut2.duration=duration;
                const data=[
                    {priority:3,type:'a',count:12},
                    {priority:3,type:'b',count:3},
                    {priority:1,type:'b',count:34},
                    {priority:2,type:'c',count:27},
                    {priority:2,type:'a',count:9},
                    {priority:3,type:'a',count:2},
                    {priority:3,type:'c',count:8},
                    {priority:3,type:'d',count:13},
                    {priority:1,type:'a',count:21},
                    {priority:2,type:'t',count:43},
                    {priority:2,type:'b',count:20},
                ];

                const colorsmap=({1:[255,0,0,0.9],2:[255,255,0,0.9],3:[0,255,0,0.9],'a':[191,71,69,0.9],'b':[66,215,136,0.9],'c':[176,190,108,0.9],'d':[79,31,142,0.9],'t':[81,156,23,0.9],});

                const mapper=(data,filters)=>{
                    const filtered=data.map((e,i)=>({
                        ...e, original:e.count, count: filters.some((f)=>(f.g==='priority' && f.l===e.priority) || (f.g==='type' && f.l===(e.priority+':'+e.type))) ? 0:e.count
                    }));
                    const g1=Object.entries(Object.groupBy(filtered,(e)=>e.priority+":"+e.type)).sort().map(([k,v],i)=>({
                        v:v.reduce((s,e)=>s+e.count,0), lv:v.reduce((s,e)=>s+e.original,0),
                        l:k, c: colorsmap[v.reduce((_,e)=>e.type,v[0].type)] ?? [127,127,127,0.9],g:'type',group:v.reduce((_,e)=>e.priority,v[0]?.priority)
                    }));
                    const g2=Object.entries(Object.groupBy(filtered,(e)=>e.priority)).sort().map(([k,v],i)=>({
                        v:v.reduce((s,e)=>s+e.count,0), lv:v.reduce((s,e)=>s+e.original,0),
                        l:k, c: colorsmap[k]  ?? [127,127,127,0.9], g:'priority'
                    }));
                    return [
                        g1.map((e,i,a)=>({...e,p:{
                            os:g1.some((e,j,a)=>j<i && e.group===a[i].group && e.v>0) ? 0 : bos,
                            oe:g1.some((e,j,a)=>j>i && e.group===a[i].group && e.v>0) ? 0 : boe,
                            ro:ro,ri:ro-(ro-ri)/2,is:0,ie:0,sa:sa,pa:pa,cw:true
                        }})),
                        g2.map((e,i,a)=>({...e,p:{ro:ri+(ro-ri)/2,ri:ri,os:0,oe:0,is:bis,ie:bie,sa:sa,pa:pa,cw:true}}))
                    ];
                };
                doughnut2.layout('row','column');
                doughnut2.mapper=mapper;
                doughnut2.addListener(callback);
                doughnut2.data=data;
                // code of doughnut2 end
            }
        }

        window.onload = function() {
            rebuildContainer();
        };

        document.getElementById('themeToggle').addEventListener('click', function() {
            document.body.classList.toggle('dark-theme');
        });

        const common=`//define element\ncustomElements.define('doughnut-chart', Doughnut);\n\nfunction callback(e){\n    console.log(e); alert(\`g:\${e.g} v:\${e.v} l:\${typeof e.l === 'string' ? e.l : e.l.textContent} c:\${e.c}\`);\n}\n\n`;
        const code=document.getElementById('code').innerText;

        const code1=code.match(new RegExp("// code of doughnut1 start\\s*\\n([\\s\\S]*?)\\n\\s*// code of doughnut1 end"))?.at(1);
        if(code1){
            document.getElementById('code1').textContent=common+code1.replace(new RegExp('^'+code1.match(/^\s+/)[0],'gm'),'');

        const code2=code.match(new RegExp("// code of doughnut2 start\\s*\\n([\\s\\S]*?)\\n\\s*// code of doughnut2 end"))?.at(1);
        if(code2){
            document.getElementById('code2').textContent=common+code2.replace(new RegExp('^'+code2.match(/^\s+/)[0],'gm'),'');
        }
